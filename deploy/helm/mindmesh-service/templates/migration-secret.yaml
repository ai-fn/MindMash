{{- if and .Values.migrations.enabled .Values.migrations.databaseUrl -}}
{{- /*
  Hook-scoped Secret holding the golang-migrate database URL, created just before
  the migration Job (lower hook-weight) and deleted after it succeeds. It is
  separate from the app env Secret because pre-install hooks run *before* the
  release's normal resources exist, so the Job can't read the app Secret on a
  first install. For prod, supply migrations.databaseUrl from your secret manager
  at deploy time (e.g. ArgoCD/CI values), not from git.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mindmesh-service.fullname" . }}-migrate
  labels:
    {{- include "mindmesh-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{ .Values.migrations.databaseUrlEnv }}: {{ .Values.migrations.databaseUrl | quote }}
{{- end -}}
