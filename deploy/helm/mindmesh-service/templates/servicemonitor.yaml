{{- if .Values.serviceMonitor.enabled -}}
{{- /*
  SCAFFOLD: Prometheus Operator scrape config for this service's /metrics on the
  http port. Requires the Prometheus Operator CRDs. Off by default (the local
  compose stack scrapes via static config instead).
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mindmesh-service.fullname" . }}
  labels:
    {{- include "mindmesh-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mindmesh-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end -}}
