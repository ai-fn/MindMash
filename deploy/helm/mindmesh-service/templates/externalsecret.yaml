{{- if .Values.externalSecrets.enabled -}}
{{- /*
  prod: the External Secrets Operator reconciles a Kubernetes Secret named
  <fullname>-env from the cloud secret manager. Requires the ESO CRDs + a
  configured (Cluster)SecretStore. The Deployment envFroms the resulting Secret.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mindmesh-service.fullname" . }}
  labels:
    {{- include "mindmesh-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "mindmesh-service.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $env, $ref := .Values.externalSecrets.remoteRefs }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $ref.key }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end -}}
