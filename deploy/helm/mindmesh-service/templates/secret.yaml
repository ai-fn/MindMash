{{- if and .Values.secret.create .Values.secret.data -}}
{{- /*
  dev/local only: renders an env Secret from values-provided data (compose-style
  creds). Never commit real prod secrets here — use externalSecrets.enabled instead.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mindmesh-service.secretName" . }}
  labels:
    {{- include "mindmesh-service.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end -}}
