apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mindmesh-service.fullname" . }}-config
  labels:
    {{- include "mindmesh-service.labels" . | nindent 4 }}
data:
  {{- /* Merge global.env with per-service env, quoting every value so the
         ConfigMap's string-only `data` contract holds for numbers/bools too. */}}
  {{- range $k, $v := (fromYaml (include "mindmesh-service.mergedEnv" .)) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
