    limits: { cpu: 500m, memory: 256Mi }

media:
  image: { registry: mindmesh, tag: dev }
  env:
    MODE: all              # one pod runs the API and the worker; no separate worker in dev
    DB_MAX_CONNS: "4"      # the API's and the worker's pools combined
  replicaCount: 1
  autoscaling: { enabled: false }
  pdb: { enabled: false }
  migrations:
    image: { registry: mindmesh, repository: migrate, tag: dev }
    autoHeal: true          # dev-only: auto-recover a dirty-wedged DB (see migrate-entrypoint.sh)
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

mediaWorker:
  enabled: false

# Frontend SPA. The in-cluster image exists for parity, but day-to-day the app is
# served via the Vite dev server (Tilt local_resource, HMR). No ingress controller
# in kind, so reach it by port-forward.
web:
  image: { registry: mindmesh, tag: dev }
  replicaCount: 1
  autoscaling: { enabled: false }
  pdb: { enabled: false }
