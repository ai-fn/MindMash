{{- if .Values.prometheusRule.enabled }}
# Requires the Prometheus Operator CRDs; rules live in files/alerts.yaml so promtool can test them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  labels:
    app.kubernetes.io/part-of: mindmesh
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/alerts.yaml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
