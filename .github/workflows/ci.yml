name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests + coverage gate
        env:
          # Ratchet FLOOR, not a target. Baseline is ~9.0% because many handler/main
          # packages have no tests yet (well-tested libs: fsrs/searchdsl/template are >95%).
          # Raise this as coverage improves; it only blocks regressions below the floor.
          COVERAGE_MIN: "8.0"
        run: |
          set -euo pipefail
          # Exclude the vendored JS-tool Go file under web/node_modules from the profile.
          pkgs="$(go list ./... | grep -v '/web/node_modules/')"
          go test -short -race -count=1 -covermode=atomic -coverprofile=cover.out $pkgs
          total="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
          echo "total coverage: ${total}% (floor ${COVERAGE_MIN}%)"
          awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit (t+0 >= m+0) ? 0 : 1 }' \
            || { echo "::error::coverage ${total}% is below the floor ${COVERAGE_MIN}%"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2   # pinned for reproducible CI (compatible with the Go 1.26 toolchain)

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.70.0   # pinned for reproducible CI
      - name: buf lint
        run: cd api && buf lint
      # A real gate now (spec 18 mandates buf breaking-change in CI). Contract-first means
      # the generated TS client must never silently drift — a breaking proto change fails CI.
      - name: buf breaking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # buf clones --against itself (outside actions/checkout's credential helper), and
          # the repo is private, so it needs its own auth via the run token.
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          cd api && buf breaking --against "https://github.com/ai-fn/MindMash.git#branch=main,subdir=api"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
