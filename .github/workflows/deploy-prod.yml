name: Deploy prod (promote)

# Deliberate prod promotion. Unlike staging (auto write-back in deploy.yml), prod is
# opt-in: this workflow pins values-prod.yaml's global.image.tag to a chosen, already-built
# SHA and commits it. ArgoCD's prod Application is autoSync:false, so a human still runs
# `argocd app sync mindmesh-prod` to cut over — this only prepares the pinned manifest.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Image SHA to promote to prod (defaults to current main HEAD)"
        required: false
        default: ""

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install yq (pinned)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
      - name: Resolve SHA
        id: sha
        env:
          # Route the untrusted workflow input through env (never interpolate ${{ inputs.* }}
          # straight into a run: block — that's a shell-injection vector).
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          SHA="$INPUT_SHA"
          [ -n "$SHA" ] || SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all prod images exist for this SHA
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          for img in identity collection scheduler sync search analytics migrate web; do
            docker manifest inspect "ghcr.io/mindmesh/${img}:${SHA}" >/dev/null \
              || { echo "::error::missing image ghcr.io/mindmesh/${img}:${SHA} — build it on main first"; exit 1; }
          done
      - name: Pin prod image tag and commit
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          yq -i '.global.image.tag = strenv(SHA)' deploy/helm/mindmesh/values-prod.yaml
          if git diff --quiet -- deploy/helm/mindmesh/values-prod.yaml; then
            echo "prod already pinned to ${SHA}"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/mindmesh/values-prod.yaml
          git commit -m "chore(deploy): promote prod image tag to ${SHA} [skip ci]"
          git push origin HEAD:main
      - name: Next step
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: echo "Prod overlay pinned to ${SHA}. Now sync deliberately -> argocd app sync mindmesh-prod"
