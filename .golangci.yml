version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - nakedret
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: \.pb\.go$
        linters:
          - all
      - path: \.pb\.gw\.go$
        linters:
          - all
      - path: _test\.go$
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
