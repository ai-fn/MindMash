run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - nakedret
    - unconvert

issues:
  exclude-rules:
    - path: \.pb\.go$
      linters:
        - all
    - path: \.pb\.gw\.go$
      linters:
        - all
    - path: _test\.go$
      linters:
        - errcheck
        - bodyclose

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
