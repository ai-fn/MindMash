version: "3"

vars:
  PKG: ./...

tasks:
  default:
    cmds:
      - task --list

  tools:
    desc: Install non-module dev tools (codegen tools are pinned in go.mod, run via `go tool`)
    cmds:
      - go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

  gen:
    desc: Generate Go stubs + OpenAPI from protos (buf)
    dir: api
    cmds:
      - go tool buf lint
      - go tool buf generate

  gen-web:
    desc: Generate the web TS API client from OpenAPI (orval)
    dir: web
    cmds:
      - npm run gen

  build:
    desc: Build all binaries
    cmds:
      - go build {{.PKG}}

  test:
    desc: Run unit + integration tests
    cmds:
      - go test -race -count=1 {{.PKG}}

  test-short:
    desc: Run unit tests only (skip testcontainers integration)
    cmds:
      - go test -short -count=1 {{.PKG}}

  lint:
    desc: Lint Go + protos
    cmds:
      - go vet {{.PKG}}
      - golangci-lint run
      - cd api && go tool buf lint

  migrate:
    desc: Apply all migrations — identity, collection, scheduler (override DB_URL as needed)
    vars:
      DB_URL: '{{.DB_URL | default "postgres://mindmesh:mindmesh@localhost:5432/mindmesh?sslmode=disable"}}'
    cmds:
      # Each store uses its own schema_migrations table to avoid version-namespace collisions.
      - migrate -path migrations/identity   -database "{{.DB_URL}}&x-migrations-table=schema_migrations_identity"   up
      - migrate -path migrations/collection -database "{{.DB_URL}}&x-migrations-table=schema_migrations_collection" up
      - migrate -path migrations/scheduler  -database "{{.DB_URL}}&x-migrations-table=schema_migrations_scheduler"  up

  keygen:
    desc: Generate local Ed25519 signing keys (skips if they already exist)
    status:
      - test -f keys/ed25519.pem
      - test -f keys/ed25519.pub.pem
    cmds:
      - mkdir -p keys
      - openssl genpkey -algorithm ed25519 -out keys/ed25519.pem
      - openssl pkey -in keys/ed25519.pem -pubout -out keys/ed25519.pub.pem

  run:
    desc: Start local deps and run the identity service
    deps: [keygen]
    env:
      DB_DSN: postgres://mindmesh:mindmesh@localhost:5432/mindmesh?sslmode=disable
      REDIS_ADDR: localhost:6379
    cmds:
      - docker compose up -d postgres redis minio jaeger
      - go run ./cmd/identity

  compose-up:
    desc: Start the full local stack
    cmds:
      - docker compose up -d

  compose-down:
    desc: Stop the local stack
    cmds:
      - docker compose down

  web-install:
    desc: Install web SPA dependencies
    dir: web
    cmds:
      - npm install

  web-dev:
    desc: Run the web SPA dev server (Vite, with backend proxy)
    dir: web
    cmds:
      - npm run dev

  web-lint:
    desc: Lint the web SPA
    dir: web
    cmds:
      - npm run lint

  web-test:
    desc: Run web SPA unit tests
    dir: web
    cmds:
      - npm run test

  web-build:
    desc: Type-check + build the web SPA
    dir: web
    cmds:
      - npm run build

  # ── Full-stack local dev on kind + Tilt (see deploy/README.md) ──────────────
  dev-up:
    desc: Bootstrap the local kind cluster (cluster + JWT secret + dev stores)
    cmds:
      - ./scripts/cluster-up.sh

  dev:
    desc: Start the app on kind with Tilt (build, deploy, port-forward, SPA HMR)
    deps: [dev-up]
    cmds:
      - tilt up

  dev-down:
    desc: Delete the local kind cluster (stops Tilt first)
    cmds:
      - ./scripts/cluster-down.sh

  dev-redeploy:
    desc: 'Rebuild+reload one service into kind (usage: task dev-redeploy -- identity)'
    cmds:
      - ./scripts/redeploy.sh {{.CLI_ARGS}}
