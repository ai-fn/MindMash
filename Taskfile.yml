version: "3"

vars:
  PKG: ./...

tasks:
  default:
    cmds:
      - task --list

  tools:
    desc: Install dev tools (buf, protoc plugins, migrate, golangci-lint, goimports)
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@latest
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
      - go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest
      - go install github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install golang.org/x/tools/cmd/goimports@latest

  gen:
    desc: Generate Go stubs + OpenAPI from protos (buf)
    dir: api
    cmds:
      - buf lint
      - buf generate

  build:
    desc: Build all binaries
    cmds:
      - go build {{.PKG}}

  test:
    desc: Run unit + integration tests
    cmds:
      - go test -race -count=1 {{.PKG}}

  test-short:
    desc: Run unit tests only (skip testcontainers integration)
    cmds:
      - go test -short -count=1 {{.PKG}}

  lint:
    desc: Lint Go + protos
    cmds:
      - go vet {{.PKG}}
      - golangci-lint run
      - cd api && buf lint

  migrate:
    desc: Apply all migrations — identity then collection (override DB_URL as needed)
    vars:
      DB_URL: '{{.DB_URL | default "postgres://mindmesh:mindmesh@localhost:5432/mindmesh?sslmode=disable"}}'
    cmds:
      # Each store uses its own schema_migrations table to avoid version-namespace collisions.
      - migrate -path migrations/identity   -database "{{.DB_URL}}&x-migrations-table=schema_migrations_identity"   up
      - migrate -path migrations/collection -database "{{.DB_URL}}&x-migrations-table=schema_migrations_collection" up

  keygen:
    desc: Generate local Ed25519 signing keys (skips if they already exist)
    status:
      - test -f keys/ed25519.pem
      - test -f keys/ed25519.pub.pem
    cmds:
      - mkdir -p keys
      - openssl genpkey -algorithm ed25519 -out keys/ed25519.pem
      - openssl pkey -in keys/ed25519.pem -pubout -out keys/ed25519.pub.pem

  run:
    desc: Start local deps and run the identity service
    deps: [keygen]
    env:
      DB_DSN: postgres://mindmesh:mindmesh@localhost:5432/mindmesh?sslmode=disable
      REDIS_ADDR: localhost:6379
    cmds:
      - docker compose up -d postgres redis minio jaeger
      - go run ./cmd/identity

  compose-up:
    desc: Start the full local stack
    cmds:
      - docker compose up -d

  compose-down:
    desc: Stop the local stack
    cmds:
      - docker compose down
