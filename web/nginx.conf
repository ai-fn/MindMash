# Full nginx config for serving the MindMesh SPA as static files.
#
# Designed to run non-root with a read-only container root filesystem (the Helm
# chart's default securityContext): every writable path lives under /tmp, which
# the pod mounts as an emptyDir. Listens on :8080 (no privileged port needed).
#
# The image is environment-agnostic: it does NOT proxy /v1/* — the edge Ingress
# routes API paths to the backend services and everything else here (same origin,
# so the SPA's relative fetches need no CORS).

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  # Keep all writable state under /tmp so the root filesystem stays read-only.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout  65;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml application/wasm;

  server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Liveness/readiness target for the k8s probes.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Fingerprinted build assets are safe to cache hard.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|ico|svg|webp|wasm)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    # index.html itself is never cached, so new deploys are picked up immediately.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
